name: agent-eval
on:
  pull_request:
    paths: ["agents.py", "guardrails.py", "data/**", "harness.py"]
  workflow_dispatch:
    inputs:
      agent:
        description: "mock | gemini | deepseek | openai | claude"
        default: "gemini"
      model:
        description: "Optional model id; blank = provider default"
        default: ""
      repeats:
        default: "2"
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openai anthropic
      - name: Run eval (non-zero exit fails the run / PR)
        run: |
          MODEL="${{ inputs.model }}"
          python harness.py --agent "${{ inputs.agent || 'mock' }}" \
                            ${MODEL:+--model "$MODEL"} \
                            --repeats "${{ inputs.repeats || '2' }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: reports/ }
